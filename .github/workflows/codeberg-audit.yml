name: One-time Codeberg upstream audit
on:
  push:
    paths:
      - '.github/workflows/codeberg-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout GitHub fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Codeberg and analyze which fixes are missing
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none --no-checkout https://codeberg.org/malucart/sm64-psx.git /tmp/sm64-codeberg
          git -C /tmp/sm64-codeberg remote add github-archive https://github.com/malucard/sm64-psx.git
          git -C /tmp/sm64-codeberg fetch --quiet github-archive master
          BASE=$(git -C /tmp/sm64-codeberg merge-base HEAD FETCH_HEAD)
          export BASE
          python3 - <<'PY'
          import os,subprocess,collections
          cb='/tmp/sm64-codeberg'
          def run(root,*args):
              return subprocess.check_output(['git','-C',root,*args],text=True).strip()
          base=os.environ['BASE']
          cb_head=run(cb,'rev-parse','HEAD')
          fork_head=run('.','rev-parse','HEAD')
          print('CODEBERG_BASE',base,flush=True)
          print('CODEBERG_HEAD',cb_head,flush=True)
          print('FORK_HEAD',fork_head,flush=True)
          def manifest(root,rev):
              out=run(root,'ls-tree','-r',rev)
              return {t[3]:t[2] for x in out.splitlines() if (t:=x.split(None,3)) and len(t)==4}
          before=manifest(cb,base)
          after=manifest(cb,cb_head)
          own=manifest('.',fork_head)
          changed=sorted(p for p in set(before)|set(after) if before.get(p)!=after.get(p))
          groups=collections.defaultdict(list)
          for path in changed:
              was=before.get(path)
              now=after.get(path)
              ours=own.get(path)
              if ours==now:
                  group='ALREADY_EQUAL_TO_CODEBERG'
              elif ours==was:
                  group='SAFE_TO_COPY_UPSTREAM'
              elif not now:
                  group='UPSTREAM_REMOVED_FORK_CHANGED'
              elif not ours:
                  group='NEW_UPSTREAM_OR_REMOVED_FORK'
              else:
                  group='FORK_DIVERGED_NEEDS_MANUAL_MERGE'
              groups[group].append(path)
          for group in ['ALREADY_EQUAL_TO_CODEBERG','SAFE_TO_COPY_UPSTREAM','UPSTREAM_REMOVED_FORK_CHANGED','NEW_UPSTREAM_OR_REMOVED_FORK','FORK_DIVERGED_NEEDS_MANUAL_MERGE']:
              print(f'===== {group} ({len(groups[group])}) =====',flush=True)
              for p in groups[group]:
                  print(p,flush=True)
          print('===== FOCUSED CODE DIFFS (CODEBERG -> FORK) =====',flush=True)
          import difflib
          focus=[
              'Makefile.pc.mk','Makefile.psx.mk','src/game/skybox.c',
              'src/goddard/gdf_obj.c','src/port/gfx/gfx.h',
              'src/port/gfx/gfx_global_dl.c','src/port/gfx/gfx_rsp_jit.c',
              'src/port/pc/gfx_dl_exec_pc.c','src/port/psx/cd_psx.c',
              'src/port/psx/gfx_dl_exec_psx.c','tools/Makefile',
              'tools/preprocess_graphics.py'
          ]
          for p in focus:
              left=subprocess.check_output(['git','-C',cb,'show',f'HEAD:{p}']).decode('utf8','replace')
              right=subprocess.check_output(['git','show',f'HEAD:{p}']).decode('utf8','replace')
              lines=list(difflib.unified_diff(left.splitlines(),right.splitlines(),
                  fromfile='codeberg/'+p,tofile='fork/'+p,lineterm='',n=3))
              print(f'===== DIFF {p} (total_lines={len(lines)}) =====',flush=True)
              for line in lines[:145]:print(line,flush=True)
              if len(lines)>145:print(f'... {len(lines)-145} more lines',flush=True)
          print('===== DIVERGED FILE DIFF STAT (FORK -> CODEBERG) =====',flush=True)
          for p in groups['FORK_DIVERGED_NEEDS_MANUAL_MERGE']:
              try:
                  a=subprocess.run(['git','show',f'HEAD:{p}'],capture_output=True).stdout
                  b=subprocess.run(['git','-C',cb,'show',f'HEAD:{p}'],capture_output=True).stdout
                  print(f'{p}: fork_bytes={len(a)} codeberg_bytes={len(b)}',flush=True)
              except Exception as e:
                  print('ERROR',p,e,flush=True)
          PY
